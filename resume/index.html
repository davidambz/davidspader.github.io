<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>David Ambrozio — Currículo</title>
    <!--
        Printable resume built from js/content.js, so the site and the PDF never disagree.
        Resume-only details (education, languages, skills) live in RESUME below.
        To regenerate the PDFs, see resume/README.md.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet" />
    <style>
        @page { size: A4; margin: 11mm 14mm; }
        * { box-sizing: border-box; }
        :root { --fg: #17171c; --body: #3a3a42; --muted: #6b6b73; --line: #e2dfda; --accent: #0f766e; }
        body {
            margin: 0;
            color: var(--fg);
            font: 9.2pt/1.34 "Bricolage Grotesque", system-ui, sans-serif;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        .page { max-width: 180mm; margin: 0 auto; }
        a { color: inherit; text-decoration: none; }

        header { padding-bottom: 8px; border-bottom: 2px solid var(--fg); }
        h1 { margin: 0; font-size: 23pt; line-height: 1; letter-spacing: -.02em; font-weight: 700; }
        .role { margin: 5px 0 0; font-size: 12pt; color: var(--accent); font-weight: 600; }
        .contacts { margin: 8px 0 0; font-size: 8.8pt; color: var(--body); line-height: 1.55; }

        section { margin-top: 10px; }
        h2 {
            margin: 0 0 5px; font-size: 8.6pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
            color: var(--accent);
            display: flex; align-items: center; gap: 10px;
        }
        h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
        p { margin: 0; color: var(--body); }

        .item { margin-bottom: 5px; break-inside: avoid; }
        .item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
        h3 { margin: 0; font-size: 10.4pt; font-weight: 600; }
        h3 .at { color: var(--muted); font-weight: 400; }
        .when { font-size: 8.8pt; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
        .item p { margin-top: 1px; }
        .stack { margin-top: 2px; font-size: 8.6pt; color: var(--muted); }

        .skills p { margin-bottom: 1px; }
        .skills b { color: var(--fg); font-weight: 600; }
        ul.plain { list-style: none; margin: 0; padding: 0; }
        ul.plain li { color: var(--body); margin-bottom: 2px; }

        @media screen {
            body { background: #e9e7e3; padding: 24px 0; }
            .page { background: #fff; padding: 14mm 15mm; max-width: 210mm; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
        }
    </style>
</head>
<body>
    <div class="page" id="cv"></div>

    <script src="../js/content.js"></script>
    <script>
        (() => {
            const C = window.CONTENT;
            const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'pt';
            const t = C.text[lang];

            // details that only the resume shows
            const RESUME = {
                pt: {
                    location: 'Bombinhas, SC — Brasil · Remoto',
                    phone: '(47) 99287-8998',
                    summaryTitle: 'Resumo profissional',
                    summary: 'Desenvolvedor fullstack desde 2018. Desenvolvo APIs, microsserviços e interfaces web, hoje principalmente com Python, Node.js e TypeScript. Já trabalhei com e-commerce, ERP, open source e plataformas de conteúdo, e no tempo livre crio meus próprios apps.',
                    experience: 'Experiência profissional', projects: 'Projetos pessoais', education: 'Formação', languages: 'Idiomas', skills: 'Habilidades',
                    degree: 'Tecnólogo em Sistemas para Internet', school: 'Universidade do Vale do Itajaí (UNIVALI)',
                    langs: ['Português (nativo)', 'Inglês (intermediário)'],
                    groups: ['Linguagens', 'Backend', 'Frontend', 'Bancos de dados', 'Infra e ferramentas', 'Integrações', 'Métodos'],
                },
                en: {
                    location: 'Bombinhas, Brazil · Remote',
                    phone: '+55 47 99287-8998',
                    summaryTitle: 'Summary',
                    summary: 'Fullstack developer since 2018. I build APIs, microservices and web interfaces, mostly with Python, Node.js and TypeScript today. I\'ve worked on e-commerce, ERP, open source and content platforms, and in my spare time I make my own apps.',
                    experience: 'Work experience', projects: 'Personal projects', education: 'Education', languages: 'Languages', skills: 'Skills',
                    degree: 'Associate degree in Internet Systems', school: 'University of Vale do Itajaí (UNIVALI)',
                    langs: ['Portuguese (native)', 'English (intermediate)'],
                    groups: ['Languages', 'Backend', 'Frontend', 'Databases', 'Infra & tools', 'Integrations', 'Methods'],
                },
            }[lang];
            const SKILLS = [
                'Python, TypeScript, JavaScript, PHP, Ruby, Go',
                'FastAPI, Node.js, NestJS, Express, Ruby on Rails, SQLAlchemy, Prisma',
                'React, Next.js, HTML, CSS',
                'PostgreSQL, MySQL',
                'Docker, Google Cloud, GitHub Actions, Linux',
                'Stripe, Auth0, Gemini, Magento, WordPress',
                'Scrum, Kanban',
            ];

            const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const month = ym => {
                const [y, m] = ym.split('-');
                return `${m}/${y}`;
            };
            const contact = label => C.contacts.find(c => c.label === label);

            document.documentElement.lang = t.htmlLang;
            document.title = `${C.name} — ${lang === 'pt' ? 'Currículo' : 'Resume'}`;

            document.getElementById('cv').innerHTML = `
                <header>
                    <div>
                        <h1>${esc(C.name)}</h1>
                        <p class="role">${esc(t.role)}</p>
                    </div>
                    <p class="contacts">
                        ${esc(RESUME.location)} · <a href="${esc(contact('WhatsApp').url)}">${esc(RESUME.phone)}</a> · <a href="${esc(contact('Email').url)}">${esc(contact('Email').text)}</a><br>
                        <a href="${esc(contact('LinkedIn').url)}">linkedin.com/${esc(contact('LinkedIn').text)}</a> · <a href="${esc(contact('GitHub').url)}">${esc(contact('GitHub').text)}</a> · <a href="https://davidambz.dev">davidambz.dev</a>
                    </p>
                </header>

                <section>
                    <h2>${esc(RESUME.summaryTitle)}</h2>
                    <p>${esc(RESUME.summary)}</p>
                </section>

                <section>
                    <h2>${esc(RESUME.skills)}</h2>
                    <div class="skills">
                        ${RESUME.groups.map((g, i) => `<p><b>${esc(g)}:</b> ${esc(SKILLS[i])}</p>`).join('')}
                    </div>
                </section>

                <section>
                    <h2>${esc(RESUME.experience)}</h2>
                    ${C.experience.map(job => `
                        <div class="item">
                            <div class="item-head">
                                <h3>${esc(job.company)} <span class="at">· ${esc(job[lang].role)}</span></h3>
                                <span class="when">${month(job.start)} – ${job.end ? month(job.end) : esc(t.present)}</span>
                            </div>
                            <p>${esc(job[lang].desc)}</p>
                            <p class="stack">${job.stack.map(esc).join(' · ')}</p>
                        </div>`).join('')}
                </section>

                <section>
                    <h2>${esc(RESUME.projects)}</h2>
                    ${C.projects.map(p => `
                        <div class="item">
                            <div class="item-head">
                                <h3>${esc(p.repo)}</h3>
                                <a class="when" href="${esc(`${C.github}/${p.repo}`)}">github.com/davidambz/${esc(p.repo)}</a>
                            </div>
                            <p>${esc(p[lang])}</p>
                            <p class="stack">${p.stack.map(esc).join(' · ')}</p>
                        </div>`).join('')}
                </section>


                    <section>
                        <h2>${esc(RESUME.education)}</h2>
                        <div class="item">
                            <div class="item-head">
                                <h3>${esc(RESUME.degree)}</h3>
                                <span class="when">2016 – 2018</span>
                            </div>
                            <p>${esc(RESUME.school)}</p>
                        </div>
                    </section>
                    <section>
                        <h2>${esc(RESUME.languages)}</h2>
                        <p>${RESUME.langs.map(esc).join(' · ')}</p>
                    </section>`;
        })();
    </script>
</body>
</html>
